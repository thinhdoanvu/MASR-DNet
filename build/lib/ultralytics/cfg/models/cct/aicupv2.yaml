# Image size = 640x640x3
nc: 1
depth_multiple: 1
width_multiple: 1

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                     # 0: 320 x 320 x 64
  - [-1, 1, Spatial_Attention, [64, 128]]         # 1: 160 x 160 x 128
  - [-1, 3, C2f, [128, True]]                     # 2: 160 x 160 x 128
  - [-1, 1, Spatial_Attention, [128, 256]]        # 3: 80 x 80 x 256
  - [-1, 6, C2f, [256, True]]                     # 4: 80 x 80 x 256
  - [-1, 1, Spatial_Attention, [256, 512]]        # 5: 40 x 40 x 512
  - [-1, 6, C2f, [512, True]]                     # 6: 40 x 40 x 512
  - [-1, 1, Spatial_Attention, [512, 1024]]       # 7: 20 x 20 x 1024
  - [-1, 3, C2f, [1024, True]]                    # 8: 20 x 20 x 1024
  - [-1, 1, SPPF, [1024, 5]]                      # 9: 20 x 20 x 1024

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]    # 10: 40x40x1024
  - [6, 1, WAFU, [512, 512]] # 11
  - [[-1, 10], 1, Concat, [1]]                    # 12
  - [-1, 3, C2f, [512, True]]                     # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]    # 14
  - [4, 1, WAFU, [256, 256]]  # 15
  - [[-1, 14], 1, Concat, [1]]                    # 16
  - [-1, 3, C2f, [256, True]]                     # 17

  - [-1, 1, Conv, [256, 3, 2]]                    # 18
  - [[-1, 13], 1, Concat, [1]]                    # 19
  - [-1, 3, C2f, [512, True]]                     # 20

  - [-1, 1, Conv, [512, 3, 2]]                    # 21
  - [9, 1, WAFU, [1024, 1024]]# 22
  - [[-1, 21], 1, Concat, [1]]                    # 23
  - [-1, 3, C2f, [1024, True]]                    # 24

  - [[17, 20, 24], 1, Detect, [nc]]               # Detect head
