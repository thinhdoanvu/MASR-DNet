nc: 80 # number of classes

# GELAN backbone
backbone:
  - [-1, 1, Conv, [32, 3, 2]] # 0-P1/2 320
  - [-1, 1, Conv, [64, 3, 2]] # 1-P2/4 160
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 1]] # 2
  - [-1, 1, AConv, [256]] # 3-P3/8 80
  - [-1, 1, RepNCSPELAN4, [256, 256, 128, 1]] # 4
  - [-1, 1, AConv, [512]] # 5-P4/16 40
  - [-1, 1, RepNCSPELAN4, [512, 512, 256, 1]] # 6
  - [-1, 1, AConv, [1024]] # 7-P5/32
  - [-1, 1, RepNCSPELAN4, [1024, 1024, 512, 1]] # 8
  - [-1, 1, SPPELAN, [1024, 1024]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #10: 240x2=480
  - [-1, 1, Contigous_Att, [1024, 512]] #12
  - [ [ -1, 6 ], 1, Concat, [ 1 ] ] # cat backbone P4: 480+360=840
  - [-1, 1, RepNCSPELAN4, [1024, 256, 128, 1]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #14: 360x2=600?
  - [ -1, 1, Contigous_Att, [ 1024, 512 ] ] #16
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3:600?
  - [-1, 1, RepNCSPELAN4, [768, 512, 128, 1]] # 17

  - [-1, 1, AConv, [512]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 1, RepNCSPELAN4, [512, 1024, 64, 1]] # 20 (P4/16-medium)

  - [-1, 1, AConv, [1024]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 1, RepNCSPELAN4, [1024, 1024, 32, 1]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)
