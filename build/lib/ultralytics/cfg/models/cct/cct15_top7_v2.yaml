nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.25, 1.0, 1024] #
#  s: [0.33, 1.0, 1024] # 317 layers, 82,752,699 parameters, 82,752,683 gradients, 148.5 GFLOPs
#  m: [0.75, 0.75, 768] #
#  l: [0.75, 1.00, 512] # 369 layers, 100,948,899 parameters, 100,948,883 gradients, 193.9 GFLOPs
#  x: [1.00, 1.25, 512] #


backbone:
  - [-1, 1, Conv, [64, 3, 2]]                       # 0- 320x320x3
  - [-1, 1, Spatial_Attention, [64, 128]]           # 1- 160x160x64
  - [-1, 3, C2f, [128]]                             # 2
  - [-1, 1, Spatial_Attention, [128, 256]]          # 3-80 80x80x256
  - [-1, 6, C2f, [256]]                             # 4
  - [-1, 1, Spatial_Attention, [256, 512]]          # 5-40 40x40x512
  - [-1, 6, C2f, [512]]                             # 6
  - [-1, 1, Spatial_Attention, [512, 1024]]         # 7-20 20x20x1024
  - [-1, 3, C2f, [1024]]                            # 8
  - [-1, 1, SPPF, [1024, 5]]                        # 9 20x20x1024

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 10 40x40x1024
  - [[-1, 6], 1, Concat, [1]]                       # 11
  - [-1, 3, C2f, [512]]                             # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      # 13 80x80x1024
  - [4, 1, MySRBlock, [256, 256]]                   # 14
  - [[-1, -2], 1, Concat, [1]]                      # 15
  - [-1, 3, C2f, [256]]                             # 16

  - [-1, 1, Conv, [256, 3, 2]]                      # 17 40x40x256,  nho + 4
  - [[-1, 12], 1, Concat, [1]]                      # 18 Medium khong can
  - [-1, 3, C2f, [512]]                             # 19

  - [-1, 1, Conv, [512, 3, 2]]                      # 20 20x20x512,  tinh dung
  - [9, 1, ASPP, [1024, 1024]]                      # 21
  - [[-1, -2], 1, Concat, [1]]                      # 22
  - [-1, 3, C2f, [1024]]                            # 23

  - [[16, 19, 23], 1, Detect, [nc]]                 # 24 Detect

