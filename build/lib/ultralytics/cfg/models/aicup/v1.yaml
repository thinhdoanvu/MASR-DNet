# YOLO-Light-Small.yaml
# Lightweight YOLO for small object detection with Ghost, DCNv2, SR-Block

nc: 1  # number of classes (edit for your dataset)
depth_multiple: 1
width_multiple: 1

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, MyGhost, [64, 128, 3, 1]]    # 1
  - [-1, 1, MyGhost, [128, 128, 3, 2]]    # 2-P2/4
  - [-1, 3, C2f, [128]]            # 3

  - [-1, 1, MyDCNv2, [128,256, 3, 2]]    # 4-P3/8
  - [-1, 3, C2f, [256]]            # 5

  - [-1, 1, MyDCNv2, [256, 512, 3, 2]]    # 6-P4/16
  - [-1, 3, C2f, [512]]            # 7

  - [-1, 1, MyDCNv2, [512, 1024, 3, 2]]   # 8-P5/32
  - [-1, 3, C2f, [1024]]           # 9
  - [-1, 1, SPPF, [1024, 5]]       # 10

head:

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 11
  - [[-1, 7], 1, Concat, [1]]      # 12
  - [-1, 1, WAFU_ROIAttention, [1536, 512]]            # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 14
  - [[-1, 5], 1, Concat, [1]]      # 15
  - [-1, 1, WAFU_ROIAttention, [768,256]]            # 16

  - [-1, 1, MyDCNv2, [256, 256, 3, 2]]    # 17
  - [[-1, 13], 1, Concat, [1]]     # 18
  - [ -1, 1, MyGhost, [ 768, 512, 3, 1 ] ]

  - [-1, 1, MyDCNv2, [512, 512, 3, 2]]    # 20
  - [[-1, 10], 1, Concat, [1]]     # 21
  - [-1, 1, WAFU_ROIAttention, [1536, 1024]]           # 22

  - [[16, 19, 22], 1, Detect, [nc]]  # Detect at P3, P4, P5
