# GELAN backbone
backbone:
  - [-1, 1, Conv, [32, 3, 2]]                       # 0-P1/2
  - [-1, 1, Conv, [64, 3, 2]]                       # 1-P2/4
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 1]]        # 2
  - [-1, 1, Spatial_Attention, [128, 240]]          # 3-P3/8
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]       # 4
  - [-1, 1, Spatial_Attention, [240, 360]]          # 5-P4/16
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]       # 6
  - [-1, 1, Spatial_Attention, [360, 480]]          # 7-P5/32
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]       # 8
  - [-1, 1, SPPELAN, [480, 240]]                    # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      #10: 240x2=480
  - [[-1, 6], 1, Concat, [1]]                       # cat backbone P4: 480+360=840
  - [-1, 1, Contigous_Att, [840, 360]]              #12
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]       # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]      #14: 360x2=600?
  - [[-1, 4], 1, Concat, [1]]                       # cat backbone P3:720+240=960
  - [-1, 1, Contigous_Att, [600, 240]]              #16
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]       # 17

  - [-1, 1, AConv, [180]]
  - [[-1, 13], 1, Concat, [1]]                      # cat head P4
