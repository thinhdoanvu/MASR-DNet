nc: 80 # number of classes
 #hspda_tsca summary: 295 layers, 65,632,331 parameters, 65,632,315 gradients, 163.5 GFLOPs
 #Class     Images  Instances      Box(P          R      mAP50  mAP50-95):
 #all       1329       1621      0.569      0.635      0.677      0.441
 #Speed: 0.1ms preprocess, 4.4ms inference, 0.0ms loss, 0.9ms postprocess per image

scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [0.33, 1.00, 1024] # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                      # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]                      # 3-P3/8
  - [-1, 3, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]                      # 5-P4/16
  - [-1, 3, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]                     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]                        # 9

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 10:       40 x 40 x 1024
  - [6, 1, Contigous_Att, [512, 1024]]              # 11:       40 x 40 x 1024
  - [[-1, 10], 1, Concat, [1]]                      # 12:       (@2)40 x 40 x 2048
  - [-1, 3, C2f, [512, True]]                       # 13:       (C2F) 40 x 40 x 512

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 14:       80 x 80 x 512
  - [4, 1, Contigous_Att, [256, 512]]               # 15:       80 x 80 x 512
  - [[-1, 14], 1, Concat, [1]]                      # 16:       (@1) 80 x 80 x 1024
  - [-1, 3, C2f, [256, True]]                       # 17:       80 x 80 x 256

  - [-1, 1, Conv, [256, 3, 2]]                      # 18:       40 x 40 x 512
  - [[-1, 13], 1, Concat, [1]]                      # 19:       (C2F)40 x 40 x 1024
  - [-1, 3, C2f, [512, True]]                       # 20:       40 x 40 x 512

  - [-1, 1, Conv, [512, 3, 2]]                      # 21:       20 x 20 x 1024
  - [9, 1, Contigous_Att, [1024, 2048]]             # 22:       20 x 20 x 2048
  - [[-1, 21], 1, Concat, [1]]                      # 23:       20 x 20 x 2560
  - [-1, 3, C2f, [1024, True]]                      # 24:       20 x 20 x 1024

  - [[17, 20, 24], 1, Detect, [nc]]                 # Detect (C2F, C2F, C2F)
