# YOLOv12 🚀, AGPL-3.0 license
# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov12n.yaml' will call yolov12.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 512] # summary: 895 layers, 26,506,496 parameters, 26,506,480 gradients, 83.3 GFLOPs


# YOLO12-turbo backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]]                      # 0-P1/2
  - [-1, 1, Spatial_Attention, [64, 128]]           # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Spatial_Attention, [128, 256]]          # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Spatial_Attention, [256, 512]]          # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Spatial_Attention, [512, 1024]]         # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]                 # 8

# YOLO12-turbo head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 9:       40 x 40 x 1024
  - [6, 1, Contigous_Att, [512, 1024]]              # 10:       40 x 40 x 1024
  - [[-1, 9], 1, Concat, [1]]                       # 11       (@2)40 x 40 x 2048
  - [-1, 2, A2C2f, [512, False, -1]]                # 12:       (C2F) 40 x 40 x 512

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 13:       80 x 80 x 512
  - [4, 1, Contigous_Att, [256, 512]]               # 14:       80 x 80 x 512
  - [[-1, 13], 1, Concat, [1]]                      # 15:       (@1) 80 x 80 x 1024
  - [-1, 2, A2C2f, [256, False, -1]]                # 16:       80 x 80 x 256

  - [-1, 1, Conv, [256, 3, 2]]                      # 17:       40 x 40 x 512
  - [[-1, 12], 1, Concat, [1]]                      # 18:       (C2F)40 x 40 x 1024
  - [-1, 2, A2C2f, [512, False, -1]]                # 19:       40 x 40 x 512

  - [-1, 1, Conv, [512, 3, 2]]                      # 20:       20 x 20 x 1024
  - [8, 1, Contigous_Att, [1024, 2048]]             # 21:       20 x 20 x 2048
  - [[-1, 20], 1, Concat, [1]]                      # 22:       20 x 20 x 2560
  - [-1, 2, C3k2, [1024, True]]                     # 23:       20 x 20 x 1024

  - [[16, 19, 23], 1, Detect, [nc]]                 # Detect (C2F, C2F, C2F)