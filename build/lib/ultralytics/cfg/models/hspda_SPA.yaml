#hspda_spa summary: 299 layers, 39,624,130 parameters, 39,624,114 gradients, 95.1 GFLOPs
#         Class     Images  Instances      Box(P          R      mAP50      mAP50@95
#           all       1329       1621      0.521      0.678      0.664      0.426
#Speed: 0.0ms preprocess, 2.1ms inference, 0.0ms loss, 0.3ms postprocess per image
  
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [0.33, 1.00, 1024]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                   # 0-P1/2
  - [-1, 1, Spatial_Attention, [64, 128]]       # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Spatial_Attention, [128, 256]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Spatial_Attention, [256, 512]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Spatial_Attention, [512, 1024]]     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]                    # 9

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                   # cat backbone P4
  - [-1, 6, C2f, [512]]                         # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                   # cat backbone P3
  - [-1, 6, C2f, [256]]                         # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]                  # cat head P4
  - [-1, 6, C2f, [512]]                         # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]                   # cat head P5
  - [-1, 6, C2f, [1024]]                        # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]             # Detect(P3, P4, P5)
